:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#34528f; --soft:#5674ad; --line:#d4e3f6; --mark:#5f86d6; --sw:17;
  --silk:cubic-bezier(.22,.8,.2,1); --tint:rgba(127,150,230,.12);

}
:root[data-theme=dark]{

  --bg:#030a2c; --ink:#eaf2ff; --soft:#b3c6ee; --line:#22378f; --mark:#cfe0ff; --tint:rgba(150,186,255,.13);
  --spectrum:linear-gradient(90deg,#a9c6ff,#fff,#a9c6ff);
}
*{box-sizing:border-box;margin:0;padding:0}

body{display:flex;flex-direction:column;min-height:100svh;background:var(--bg);color:var(--ink);font:italic var(--tw) calc(1rem*var(--ts))/1.5 var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-kerning:normal}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--mark);outline-offset:4px;border-radius:2px}

:root[data-theme=dark] .top{background-image:radial-gradient(circle at 12% 30%,#dbe8ff .6px,transparent 1.1px),radial-gradient(circle at 27% 62%,#dbe8ff .5px,transparent 1px),radial-gradient(circle at 44% 18%,#ffe9d0 .6px,transparent 1.1px),radial-gradient(circle at 61% 44%,#dbe8ff .5px,transparent 1px),radial-gradient(circle at 73% 14%,#dbe8ff .7px,transparent 1.2px),radial-gradient(circle at 88% 38%,#dbe8ff .5px,transparent 1px),radial-gradient(circle at 36% 40%,#dbe8ff .4px,transparent .9px),radial-gradient(circle at 80% 66%,#dbe8ff .4px,transparent .9px)}

.horizon{position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--line);transform-origin:left;z-index:1}
:root[data-theme=dark] .horizon{background:rgba(190,214,255,.5);box-shadow:0 0 12px rgba(140,180,255,.5)}
.name{position:absolute;left:50%;bottom:calc(var(--lw)*-0.04690);width:var(--lw);transform:translateX(-50%);z-index:2;font-weight:400}
.name>div{position:relative}
.lockup{display:block;width:100%;height:auto;overflow:visible}
.over{position:absolute;inset:0}
:root[data-theme=dark] .lockup:not(.over){filter:drop-shadow(0 0 7px rgba(176,208,255,.6))}
.fl{fill:none;stroke:url(#iris);stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
:root[data-theme=dark] .fl{stroke:#dbe8ff}
.barb{stroke-width:calc(var(--sw)*.6)}

:root[data-theme=dark] .g{fill:#f6faff;stroke:#f6faff}
.glint{fill:none;stroke:#fff;stroke-width:calc(var(--sw)*1.35);stroke-linecap:round;stroke-dasharray:.07 2;stroke-dashoffset:-1.2;opacity:0}
:root:not([data-theme=dark]) .glint{stroke:url(#prism)}
.tip path{fill:#7f9fe6}

.tip{transform-box:fill-box;transform-origin:center}

.sky-toggle{position:absolute;left:24px;top:max(.7rem,env(safe-area-inset-top));z-index:4;display:flex;align-items:center;gap:.5em;min-height:44px;color:var(--soft);font-size:1.02rem;touch-action:manipulation}
.sky-toggle svg{width:.6em;height:.6em;fill:var(--mark);transition:transform 1s cubic-bezier(.2,1,.3,1)}

@keyframes spin{from{transform:rotate(0) scale(1)}45%{transform:rotate(120deg) scale(1.55)}to{transform:rotate(180deg) scale(1)}}

.horizon{animation:growx 1.1s cubic-bezier(.65,0,.2,1) .1s both}
.arc{animation:draw 1.45s cubic-bezier(.46,.02,.3,1) .35s both}

.row::before,.row::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;transform-origin:left}
.row::before{background:var(--line);animation:drawx .95s var(--silk) var(--d) both}
.row::after{background:var(--spectrum);transform:scaleX(0);transition:transform .8s var(--silk)}

/* The butterfly. Each outline is a chain of anchors [x, y, direction°, handle in, handle out].

  var FORE=[[5,-11,-63,0,57],[103,-105,-9,54,3.6],[108.5,-98,115,3.6,40],[79,-18,110,38,10],[63,-4.5,180,12,22],[5,-5,187,22,0]];

  var D=Math.PI/180;
  function chain(a){
    var s=[];
    for(var i=0;i<a.length-1;i++){
      var p=a[i],q=a[i+1],u=p[2]*D,v=q[2]*D;

  (dark?[[0,0],[.5,.09],[.85,.26],[1,.42]]:[[0,0],[.45,.2],[.8,.6],[1,.93]]).forEach(function(c){thin.addColorStop(c[0],'rgba('+veil+','+c[1]+')')});
  ctx.fillStyle=thin;
  for(var cx=0;cx<W+step;cx+=step){
    var k=.74+.26*ragged(cx*.3,1.7+t*.05);
    ctx.setTransform(DPR,0,0,DPR*k,cx*DPR,(shore(cx,t)+5)*DPR);
    ctx.fillRect(0,-SH,step,SH);
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* three thin sheets of wave sliding over one another */
  [[30,.06,.21],[72,.05,.37],[122,.035,.53]].forEach(function(w,i){
    ctx.fillStyle='rgba('+veil+','+(dark?w[1]*.8:w[1]*1.5)+')';
    band(function(x){return shore(x,t)-w[0]-13*ragged(x*w[2],i*2.4+t*.07)},function(x){return shore(x,t)+6});
  });

  /* sand, then its soft wet margin */
  var bgc=dark?'3,10,44':'255,255,255',sand=ctx.createLinearGradient(0,H*.62,0,H);
  sand.addColorStop(0,dark?'rgba(9,22,92,1)':'rgba(243,249,254,1)');sand.addColorStop(.72,'rgba('+bgc+',1)');
  ctx.fillStyle=sand;ctx.beginPath();
  for(var sx=-10;sx<=W+10;sx+=9){var sy=shore(sx,t);sx<0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy)}
  ctx.lineTo(W+10,H);ctx.lineTo(-10,H);ctx.closePath();ctx.fill();
  ctx.lineJoin='round';ctx.lineCap='round';
  [[52,.02],[40,.025],[29,.03],[20,.04],[12,.05],[6,.06]].forEach(function(w){
    ctx.strokeStyle=(dark?'rgba(80,128,250,':'rgba(120,178,234,')+(dark?w[1]*1.6:w[1])+')';ctx.lineWidth=w[0];
    ctx.beginPath();for(var x=-10;x<=W+10;x+=10){var y=shore(x,t)+2;x<0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
  });

  /* a few stars the tide left */
  sandStars.forEach(function(s){
    ctx.globalAlpha=dark?.8:.72;ctx.save();ctx.translate(s.x,shore(s.x,t*.0)+s.o);ctx.rotate(s.r);
    ctx.drawImage(sp.stars[s.i%sp.stars.length],-s.s,-s.s,s.s*2,s.s*2);ctx.restore();
  });

  /* the edge itself: a thread of foam, uneven, with bubbles strung behind it */
  ctx.globalAlpha=1;
  [[20,.2,1],[9,.52,2.4],[3.8,.98,3.7]].forEach(function(b){
    ctx.fillStyle='rgba('+foam+','+b[1]+')';
    band(function(x){return shore(x,t)-b[0]*(.56+.34*ragged(x,b[2]+t*.08))},function(x){return shore(x,t)+1.6});
  });
  ctx.fillStyle='rgb('+foam+')';
  lace.forEach(function(p){ctx.globalAlpha=p.a;ctx.fillRect(p.x,shore(p.x,t)-p.o,p.s,p.s)});
  ctx.globalAlpha=1;
}
function frame(now){if(!running)return;var t=(now-t0)/1000,dt=Math.min(.05,t-lastT);lastT=t;render(t,dt);raf=requestAnimationFrame(frame)}
function sim(){return reduce?12:(performance.now()-t0)/1000}
function once(){render(sim(),0)}
function start(){if(running||reduce)return;running=true;lastT=sim();raf=requestAnimationFrame(frame)}
function stop(){running=false;cancelAnimationFrame(raf)}
function size(){
  var r=sec.getBoundingClientRect(),w=Math.round(r.width),h=Math.round(r.height);
  if(!w||!h||(w===W&&h===H))return;
  W=w;H=h;DPR=Math.min(devicePixelRatio||1,1.5);cv.width=W*DPR;cv.height=H*DPR;
  populate();makeSprites();makeFlies();makeWater();once();
  var bn=sec.querySelector('.sand-bunny');
  if(bn){var bx=Math.round(W*.76);bn.style.left=(bx-22)+'px';bn.style.top=Math.round(shore(bx,0)+H*.052-44)+'px'}
}
function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointermove',function(e){
  if(reduce||e.pointerType!=='mouse')return;var p=pt(e),t=sim();hand.x=p.x;hand.y=p.y;hand.t=t;
  if(t-lastWake>.24&&p.y<shore(p.x,t)&&rings.length<14){lastWake=t;rings.push({x:p.x,y:p.y,t:t,small:true})}
});
cv.addEventListener('pointerdown',function(e){
  var p=pt(e),t=sim();hand.x=p.x;hand.y=p.y;hand.t=t;if(p.y>shore(p.x,t))return;
  rings.push({x:p.x,y:p.y,t:t});
  for(var i=0;i<9;i++){var a=rand(0,6.28),d=rand(14,84);
    drops.push({x:p.x,y:p.y,dx:Math.cos(a)*d,dy:Math.sin(a)*d*.34,s:rand(2.2,6),i:Math.random()*8|0,r:rand(0,6),t:t,life:rand(5,9)})}
  if(drops.length>200)drops.splice(0,drops.length-200);
  if(reduce)render(t+.5,0);
});
new ResizeObserver(size).observe(sec);size();
new IntersectionObserver(function(en){en[0].isIntersecting?start():stop()},{rootMargin:'120px'}).observe(sec);
document.addEventListener('visibilitychange',function(){if(document.hidden)stop();else{var r=sec.getBoundingClientRect();if(r.top<innerHeight&&r.bottom>0)start()}});


/* The name answers a passing hand */
(function(){
  var glyphs=[].slice.call(document.querySelectorAll('.lockup .g')),name=document.querySelector('.name');
  if(reduce||!glyphs.length||!name)return;
  var xs=[],cur=glyphs.map(function(){return 0}),mx=null,on=false;
  function step(){
    var moving=false,sig=Math.max(46,name.getBoundingClientRect().width*.075);
    glyphs.forEach(function(g,i){
      var tg=mx===null?0:Math.exp(-Math.pow((xs[i]-mx)/sig,2));cur[i]+=(tg-cur[i])*.13;
      if(Math.abs(cur[i]-tg)>.002||cur[i]>.002)moving=true;
      g.style.transform=cur[i]>.002?'translateY('+(-cur[i]*62).toFixed(1)+'px)':'';
    });
    if(moving)requestAnimationFrame(step);else on=false;
  }
  function go(x){if(!xs.length||mx===null)xs=glyphs.map(function(g){var r=g.getBoundingClientRect();return r.left+r.width/2});mx=x;if(!on){on=true;requestAnimationFrame(step)}}
  name.addEventListener('pointermove',function(e){go(e.clientX)});
  name.addEventListener('pointerdown',function(e){go(e.clientX);setTimeout(function(){mx=null},260)});
  name.addEventListener('pointerleave',function(){mx=null});
  addEventListener('resize',function(){xs=[]});
})();

/* Day and night */
var buttons=document.querySelectorAll('[data-toggle]'),tc=document.getElementById('tc');
function labels(){var d=isDark();buttons.forEach(function(b){b.querySelector('.lbl').textContent=d?'Day':'Night';b.setAttribute('aria-label',d?'Switch to day':'Switch to night')})}
function apply(next){
  root.dataset.theme=next;tc.content=next==='dark'?'#030a2c':'#ffffff';try{localStorage.setItem('sanra-theme',next)}catch(e){}
  labels();if(W){makeSprites();makeFlies();makeWater();once()}
}
labels();
buttons.forEach(function(b){b.addEventListener('click',function(e){
  b.classList.add('sw');setTimeout(function(){b.classList.remove('sw')},1000);
  var next=isDark()?'light':'dark';
  if(!document.startViewTransition||reduce){apply(next);return}
  var x=e.clientX||innerWidth/2,y=e.clientY||innerHeight/2,R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(function(){apply(next)}).ready.then(function(){
    root.animate({clipPath:['circle(0 at '+x+'px '+y+'px)','circle('+R+'px at '+x+'px '+y+'px)']},{duration:1100,easing:'cubic-bezier(.4,0,.1,1)',pseudoElement:'::view-transition-new(root)'});
  });
})});
})();
</script>
