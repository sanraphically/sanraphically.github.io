<style>
@font-face{font-family:"SanraDisplay";font-style:italic;font-weight:100 900;src:url(fonts/display-noto-i.woff2) format("woff2");font-display:swap}
@font-face{font-family:"SanraText";font-style:normal;font-weight:100 900;src:url(fonts/text-jost.woff2) format("woff2");font-display:swap}

:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#34528f; --soft:#4f6ca6; --line:#d4e3f6; --mark:#5f86d6;
  --display:"SanraDisplay",Georgia,serif; --text:"SanraText",Georgia,serif; --dw:200; --tw:300;
  --gutter:7vw; --sw:10.5;
  --silk:cubic-bezier(.22,.8,.2,1);
  --string:linear-gradient(180deg,#e4f0fc 0,#b4d2f6 16%,#b3b6f1 32%,#e8b2dc 45%,#fcc6c0 54%,#ffe0a6 60%,#c9efd2 68%,#a9e2ef 78%,#c9e6f8 90%,rgba(214,236,250,0) 100%);
  --pillar:linear-gradient(180deg,#fff 0,#d3e6fa 14%,#bcd7f8 30%,#d6cdf6 44%,#fad6e4 54%,#fff0cc 60%,#d9f5e4 69%,#c8edf6 80%,#fff 100%);
  --spectrum:linear-gradient(90deg,#5f86d6,#8d7be0,#d76fae,#e0a45a,#4fbf98,#3f9fe0);
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#030a2c; --ink:#eaf2ff; --soft:#b3c6ee; --line:#22378f; --mark:#cfe0ff;
  --string:linear-gradient(180deg,rgba(150,185,255,.1) 0,rgba(165,196,255,.42) 26%,rgba(205,224,255,.78) 48%,#fff 60%,rgba(190,214,255,.7) 67%,rgba(120,160,255,.32) 82%,rgba(90,130,255,0) 100%);
  --pillar:linear-gradient(180deg,#020823 0,#0e2596 24%,#5f8cff 46%,#f7fbff 60%,#6d97ff 66%,#102aa6 82%,#030a2c 100%);
  --spectrum:linear-gradient(90deg,#a9c6ff,#fff,#a9c6ff);
}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:var(--tw) clamp(1.02rem,.99rem + .16vw,1.14rem)/1.6 var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:1px solid var(--mark);outline-offset:5px;border-radius:2px}
::selection{background:#dfe9fb;color:#34528f}

/* The first screen of the main page: a blank page, a line, the name, a harp of light */
.hero{--hh:max(100svh,640px);--h:calc(var(--hh)*.4);--lw:clamp(340px,36vw,580px);position:relative;min-height:var(--hh);overflow:hidden;background:var(--bg);padding:calc(var(--h) + clamp(2rem,5.5vh,3.4rem)) var(--gutter) clamp(2.4rem,7vh,4rem)}
:root[data-theme=dark] .hero{background:radial-gradient(62% 26% at 27% 40%,rgba(58,98,238,.3),transparent 72%),radial-gradient(26% 46% at 79% 40%,rgba(92,128,255,.2),transparent 74%),linear-gradient(180deg,#020823 0,#040f3f 28%,#081a66 40%,#050f45 58%,var(--bg) 100%)}
:root[data-theme=dark] .hero::before{content:"";position:absolute;inset:0;background-image:var(--grain,none);background-size:110px;opacity:.1;mix-blend-mode:overlay;pointer-events:none}
.aura{position:absolute;inset:0;pointer-events:none;background:radial-gradient(22% 40% at 78% 40%,rgba(203,196,250,.2),transparent 72%),radial-gradient(26% 5% at 78% 40%,rgba(255,228,196,.24),transparent 74%),radial-gradient(24% 26% at 80% 60%,rgba(180,236,226,.16),transparent 74%)}
:root[data-theme=dark] .aura{display:none}
.horizon{position:absolute;left:0;right:0;top:var(--h);height:1px;background:var(--line);z-index:1;transform-origin:left}
:root[data-theme=dark] .horizon{background:rgba(190,214,255,.5);box-shadow:0 0 14px rgba(140,180,255,.5)}

.harp{--up:calc(var(--h)*.9);--down:calc((var(--hh) - var(--h))*.94);--p:7px;position:absolute;top:0;height:var(--hh);right:9vw;display:flex;z-index:2}
.s{position:relative;width:var(--p);height:100%}
.s i{position:absolute;left:50%;width:1px;top:calc(var(--h) - var(--up)*var(--u));height:calc(var(--up)*var(--u) + var(--down)*var(--d));background-image:var(--string);background-size:100% var(--hh);background-position:0 calc(var(--up)*var(--u) - var(--h));background-repeat:no-repeat;transform-origin:50% calc(var(--up)*var(--u))}
.s i::after{content:"";position:absolute;left:-.5px;width:2px;height:58px;top:-58px;opacity:0;background:linear-gradient(180deg,transparent,var(--mark),transparent)}
.s.pluck{animation:pluck .95s ease-out}
.s.pluck i::after{animation:bead .9s cubic-bezier(.3,.1,.3,1)}
.pillar{-webkit-mask-image:linear-gradient(180deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(180deg,transparent,#000 10%,#000 90%,transparent);position:relative;width:clamp(14px,1.75vw,28px);height:100%;margin-left:6px;background-image:var(--grain,none),var(--pillar);background-size:110px,100% 100%;background-blend-mode:soft-light;transform-origin:50% var(--h)}

.name{position:absolute;left:var(--gutter);top:calc(var(--h) - var(--lw)*0.24231);width:var(--lw);z-index:3;font-weight:400}
.name a{display:block;position:relative}
.lockup{display:block;width:100%;height:auto;overflow:visible}
.over{position:absolute;inset:0}
:root[data-theme=dark] .lockup:not(.over){filter:drop-shadow(0 0 5px rgba(255,176,222,.5)) drop-shadow(0 0 20px rgba(98,128,255,.75))}
.fl{fill:none;stroke:url(#iris);stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
:root[data-theme=dark] .fl{stroke:#dbe8ff}
.barb{stroke-width:calc(var(--sw)*.6)}
.g{fill:url(#word);stroke:url(#word);stroke-width:calc(var(--sw)*.7);stroke-opacity:0;stroke-dasharray:1;stroke-dashoffset:0}
:root[data-theme=dark] .g{fill:url(#neon);stroke:url(#neon)}
.glint{fill:none;stroke:#fff;stroke-width:calc(var(--sw)*1.35);stroke-linecap:round;stroke-dasharray:.07 2;stroke-dashoffset:-1.2;opacity:0}
:root:not([data-theme=dark]) .glint{stroke:url(#prism)}
.tip path{fill:#7f9fe6}
:root[data-theme=dark] .tip path{fill:#fff}
.tip{transform-box:fill-box;transform-origin:center}

.sky-toggle{position:absolute;left:calc(var(--gutter) - 1em);top:calc(clamp(1.3rem,4.4vh,2.5rem) - .45em + env(safe-area-inset-top,0px));z-index:8;display:flex;align-items:center;gap:.5em;min-height:44px;padding:.45em 1em;color:var(--soft);font-size:.92em;line-height:1.3;transition:color .5s}
.sky-toggle:hover,.sky-toggle:focus-visible{color:var(--ink)}
.sky-toggle svg{width:.62em;height:.62em;fill:var(--mark);transition:transform 1s cubic-bezier(.2,1,.3,1)}
.sky-toggle:hover svg{transform:rotate(90deg) scale(1.3)}
.sky-toggle.sw svg{animation:spin .95s var(--silk)}

/* The links */
.intro{position:relative;z-index:3;max-width:30rem}
.tag{color:var(--soft);text-wrap:balance;font-size:1.06em}
.tag .w{display:inline-block}
.rows{list-style:none;margin-top:clamp(1.3rem,3.4vh,2rem)}
.rows li{position:relative}
.rows li::before,.rows::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--line);transform-origin:left}
.rows{position:relative}.rows::after{top:auto;bottom:0}
.row{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:.2rem 1.2rem;flex-wrap:wrap;min-height:60px;padding:.72rem 0 .8rem}
.row::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--spectrum);transform:scaleX(0);transform-origin:left;transition:transform .8s cubic-bezier(.2,.8,.2,1);z-index:1}
.row b{font:italic var(--dw) clamp(1.62rem,1.36rem + 1.1vw,2.05rem)/1.12 var(--display);color:var(--ink);transition:translate .8s cubic-bezier(.2,.8,.2,1)}
.row span{position:relative;color:var(--soft);font-size:.92em;padding-right:1.05em;overflow-wrap:anywhere;transition:color .4s}
.row span svg{position:absolute;right:0;top:.5em;width:.58em;height:.58em;fill:var(--mark);opacity:0;transform:scale(.2) rotate(-50deg);transition:opacity .25s,transform .7s cubic-bezier(.2,1.5,.4,1)}
.row:hover::after,.row:focus-visible::after,.row:active::after{transform:none}
.row:hover b,.row:focus-visible b,.row:active b{translate:5px 0}
.row:hover span,.row:focus-visible span{color:var(--ink)}
.row:hover span svg,.row:focus-visible span svg,.row:active span svg{opacity:1;transform:none}
.row:focus-visible{outline-offset:2px}
/* Ko-fi: its star stays lit, and now and then a bead of current runs along its line */
.kofi::before{content:"";position:absolute;left:-64px;top:0;width:64px;height:1px;opacity:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,transparent,#e8b2dc,#ffe0a6,#a9e2ef,transparent);box-shadow:0 0 8px 1px rgba(232,178,220,.45)}
:root[data-theme=dark] .kofi::before{background:linear-gradient(90deg,transparent,#a9c6ff,#fff,#a9c6ff,transparent);box-shadow:0 0 9px 1px rgba(150,185,255,.7)}
.anim .kofi::before{animation:current 6.5s cubic-bezier(.45,0,.3,1) 2.6s infinite}
.kofi span svg{opacity:1;transform:none}
.anim .kofi span svg{animation:twinkle 6.5s ease-in-out 3.4s infinite}
@keyframes current{0%{left:-64px;opacity:0}6%{opacity:1}34%{opacity:1}40%{left:100%;opacity:0}100%{left:100%;opacity:0}}

/* Opening, first visit of a session only. The links are there from the first moment; the name draws itself beside them.
   Keyframes hold only start states, so with motion off the page is simply complete. */
.first .horizon{animation:growx 1.5s cubic-bezier(.65,0,.2,1) .1s both}
.first .arc{animation:draw 2.3s cubic-bezier(.46,.02,.3,1) .35s both}
.first .head{animation:draw .36s ease-out 2.5s both}
.first .barb{animation:draw .42s ease-out calc(2.05s + var(--i)*14ms) both}
.first .g{animation:trace 1.8s ease-in-out calc(.5s + var(--i)*70ms) both,fillin 1.2s ease calc(1.15s + var(--i)*70ms) both}
.anim .glint{animation:glint 2.6s cubic-bezier(.4,0,.3,1) 9s infinite}
.first .tip{animation:pop .9s cubic-bezier(.2,1.6,.4,1) 2.7s both,twinkle 6.5s ease-in-out 4.6s infinite}
.anim:not(.first) .tip{animation:twinkle 6.5s ease-in-out 2s infinite}
.first .pillar{animation:growy 1.7s cubic-bezier(.3,0,.1,1) .9s both}
.first .s i{animation:growy 1.4s cubic-bezier(.3,0,.1,1) calc(1s + var(--i)*26ms) both}
.first .aura{animation:fade 2.2s ease 1.2s both}
.first .tag .w{animation:mist 1s var(--silk) calc(.25s + var(--i)*90ms) both}
.first .rows li{animation:mist .9s var(--silk) calc(.3s + var(--i)*70ms) both}
.first .rows li::before,.first .rows::after{animation:growx 1.1s cubic-bezier(.65,0,.2,1) calc(.2s + var(--i,5)*70ms) both}
.first .sky-toggle{animation:fade 1.2s ease 1.4s both}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes trace{0%{stroke-dashoffset:1;stroke-opacity:1}62%{stroke-dashoffset:0;stroke-opacity:1}100%{stroke-dashoffset:0;stroke-opacity:0}}
@keyframes fillin{from{fill-opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes glint{0%{stroke-dashoffset:.07;opacity:0}10%{opacity:1}86%{opacity:1}100%{stroke-dashoffset:-1;opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(0) rotate(-40deg)}}
@keyframes twinkle{0%,100%{transform:none}50%{transform:scale(.66) rotate(16deg)}}
@keyframes mist{from{opacity:0;transform:translateY(4px)}}
@keyframes bead{0%{top:-40px;opacity:0}12%{opacity:1}100%{top:100%;opacity:0}}
@keyframes pluck{0%{transform:translateX(0)}12%{transform:translateX(1.6px)}26%{transform:translateX(-1.3px)}42%{transform:translateX(.9px)}60%{transform:translateX(-.5px)}80%{transform:translateX(.2px)}100%{transform:none}}
@keyframes spin{from{transform:rotate(0) scale(1)}45%{transform:rotate(120deg) scale(1.55)}to{transform:rotate(180deg) scale(1)}}

@media (max-width:1000px){:root{--sw:13}}
@media (max-width:700px){
  :root{--gutter:24px;--sw:20}
  .hero{--hh:max(100svh,600px);--h:calc(var(--hh)*.33);--lw:calc(100vw - 48px);padding-top:calc(var(--h) + 1.9rem)}
  .harp{--p:5px;top:var(--h);height:calc(var(--hh) - var(--h));right:24px;--up:0px;--down:calc((var(--hh) - var(--h))*.94)}
  .s i{top:0;height:calc(var(--down)*var(--d));background-position:0 calc(0px - var(--h));transform-origin:50% 0}
  .s:nth-child(2n){display:none}
  .pillar{-webkit-mask-image:linear-gradient(180deg,#000 84%,transparent);mask-image:linear-gradient(180deg,#000 84%,transparent);width:11px;margin-left:5px;transform-origin:50% 0;background-position:0 0,0 calc(0px - var(--h));background-size:110px,100% var(--hh)}
  .intro{max-width:calc(100vw - 48px - 108px)}
  .row{display:block;min-height:64px;padding:.6rem 0 .7rem}
  .row b{display:block}
  .row span{display:inline-block;margin-top:.1rem;font-size:.9em}
}
@media (max-width:700px) and (max-height:700px){
  .hero{--h:calc(var(--hh)*.28)}
  .row{min-height:58px;padding:.48rem 0 .56rem}
  .rows{margin-top:1.1rem}
}
@media (min-resolution:2dppx){
  .horizon{height:.5px;background:#bcd2ef}
  :root[data-theme=dark] .horizon{background:rgba(205,224,255,.75)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.glint{opacity:0}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}
</style>

/* Day and night, shared with the main page */
var b=document.querySelector('[data-toggle]'),tc=document.getElementById('tc');
function label(){var d=isDark();b.querySelector('.lbl').textContent=d?'Day':'Night';b.setAttribute('aria-label',d?'Switch to day':'Switch to night')}
function apply(next){root.dataset.theme=next;tc.content=next==='dark'?'#030a2c':'#ffffff';try{localStorage.setItem('sanra-theme',next)}catch(e){}label()}
label();
b.addEventListener('click',function(e){
  b.classList.add('sw');setTimeout(function(){b.classList.remove('sw')},1000);
  var next=isDark()?'light':'dark';
  if(!document.startViewTransition||reduce){apply(next);return}
  var x=e.clientX||innerWidth/2,y=e.clientY||innerHeight/2,R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(function(){apply(next)}).ready.then(function(){
    root.animate({clipPath:['circle(0 at '+x+'px '+y+'px)','circle('+R+'px at '+x+'px '+y+'px)']},{duration:1300,easing:'cubic-bezier(.4,0,.1,1)',pseudoElement:'::view-transition-new(root)'});
  });
});

/* Email links do nothing inside the TikTok and Instagram browsers, so a tap also copies the address and says so */
function oldCopy(txt){var ok=false,ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok}
function copyText(txt){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(txt).then(function(){return true},function(){return oldCopy(txt)});return Promise.resolve(oldCopy(txt))}
var mail=document.getElementById('mail'),label2=mail.querySelector('span i'),was=label2.textContent,t=0;
mail.addEventListener('click',function(){copyText(was).then(function(ok){if(!ok)return;label2.textContent='Address copied';clearTimeout(t);t=setTimeout(function(){label2.textContent=was},2600)})});
})();
</script>
